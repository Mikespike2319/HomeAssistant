title: Weather
path: weather
icon: mdi:weather-partly-cloudy
type: sections
max_columns: 1
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: custom:button-card
    template: sky_system
  - type: custom:button-card
    template: mf_page_title
    variables:
      eyebrow: ATMOSPHERE · LOCAL
      title: Outside now
      subtitle: Forecast, air, and daylight without the clutter.
  - type: custom:button-card
    template: mf_hero
    entity: weather.forecast_home
    variables:
      icon: '[[[ const map = {sunny:"mdi:white-balance-sunny", "clear-night":"mdi:weather-night", partlycloudy:"mdi:weather-partly-cloudy", cloudy:"mdi:weather-cloudy", rainy:"mdi:weather-rainy",
        pouring:"mdi:weather-pouring", lightning:"mdi:weather-lightning", snowy:"mdi:weather-snowy", fog:"mdi:weather-fog", windy:"mdi:weather-windy"}; return map[entity?.state] || "mdi:weather-partly-cloudy";
        ]]]'
      value: '[[[ return Math.round(entity?.attributes?.temperature ?? 0) + "°"; ]]]'
      subtitle: '[[[ const raw = (entity?.state || "Weather").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase()); const humidity = entity?.attributes?.humidity; const wind = entity?.attributes?.wind_speed;
        return `${raw}${humidity != null ? " · " + humidity + "% humidity" : ""}${wind != null ? " · " + Math.round(wind) + " mph wind" : ""}`; ]]]'
      accent_color: rgba(107,226,255,0.96)
  - type: custom:button-card
    template: mf_section_label
    variables:
      icon: mdi:clock-outline
      label: Next few hours
      accent_color: rgba(107,226,255,0.96)
  - type: custom:mod-card
    style: "ha-card {\n  overflow: hidden !important;\n  padding: 8px !important;\n  border-radius: 22px !important;\n  border: 1px solid rgba(137,210,255,0.16) !important;\n  background:\
      \ linear-gradient(150deg, rgba(15,23,36,0.82), rgba(7,12,22,0.76)) !important;\n  box-shadow: 0 20px 52px rgba(1,5,14,0.38), inset 0 1px 0 rgba(255,255,255,0.05) !important;\n\
      \  backdrop-filter: blur(22px) saturate(1.18);\n}\n"
    card:
      type: weather-forecast
      entity: weather.forecast_home
      forecast_type: hourly
      show_current: false
      show_forecast: true
      name: Hourly
  - type: custom:button-card
    template: mf_section_label
    variables:
      icon: mdi:chart-timeline-variant-shimmer
      label: Sky telemetry
      accent_color: rgba(157,119,255,0.96)
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: mf_tile
      entity: sun.sun
      variables:
        icon: mdi:weather-sunset-up
        title: Sunrise
        value: '[[[ const d = new Date(entity?.attributes?.next_rising); return Number.isNaN(d.getTime()) ? "—" : d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); ]]]'
        subtitle: next light
        accent_color: rgba(255,207,120,0.96)
    - type: custom:button-card
      template: mf_tile
      entity: sun.sun
      variables:
        icon: mdi:weather-sunset-down
        title: Sunset
        value: '[[[ const d = new Date(entity?.attributes?.next_setting); return Number.isNaN(d.getTime()) ? "—" : d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); ]]]'
        subtitle: golden hour
        accent_color: rgba(255,146,132,0.96)
    - type: custom:button-card
      template: mf_tile
      entity: weather.forecast_home
      variables:
        icon: mdi:water-percent
        title: Humidity
        value: '[[[ return (entity?.attributes?.humidity ?? "—") + (entity?.attributes?.humidity != null ? "%" : ""); ]]]'
        subtitle: relative humidity
        accent_color: rgba(107,226,255,0.96)
    - type: custom:button-card
      template: mf_tile
      entity: weather.forecast_home
      variables:
        icon: mdi:weather-windy
        title: Wind
        value: '[[[ const n = Number(entity?.attributes?.wind_speed); return Number.isFinite(n) ? Math.round(n) + " mph" : "—"; ]]]'
        subtitle: current speed
        accent_color: rgba(139,244,196,0.96)
  - type: custom:button-card
    template: mf_section_label
    variables:
      icon: mdi:calendar-week
      label: Seven-day outlook
      accent_color: rgba(255,207,120,0.96)
  - type: custom:mod-card
    style: "ha-card {\n  overflow: hidden !important;\n  padding: 8px !important;\n  border-radius: 22px !important;\n  border: 1px solid rgba(137,210,255,0.16) !important;\n  background:\
      \ linear-gradient(150deg, rgba(15,23,36,0.82), rgba(7,12,22,0.76)) !important;\n  box-shadow: 0 20px 52px rgba(1,5,14,0.38), inset 0 1px 0 rgba(255,255,255,0.05) !important;\n\
      \  backdrop-filter: blur(22px) saturate(1.18);\n}\n"
    card:
      type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
      show_current: false
      show_forecast: true
      name: This week
