title: Media
path: media
icon: mdi:television-play
type: sections
max_columns: 1
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: custom:button-card
    template: sky_system
  - type: custom:button-card
    template: mf_page_title
    variables:
      eyebrow: MEDIA · NOW PLAYING
      title: Signal room
      subtitle: Screens, Sonos, and room playback in one place.
  - type: custom:button-card
    template: mf_media_status
  - type: custom:button-card
    template: mf_media_now
    entity: media_player.bed_room_tv
    variables:
      title: Bedroom TV
      room: Bedroom TV
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:skip-previous
        label: Previous
        accent_color: rgba(155,134,255,0.96)
      tap_action:
        action: call-service
        service: media_player.media_previous_track
        target:
          entity_id: media_player.bed_room_tv
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:play-pause
        label: Play / pause
        accent_color: rgba(107,226,255,0.96)
      tap_action:
        action: call-service
        service: media_player.media_play_pause
        target:
          entity_id: media_player.bed_room_tv
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:skip-next
        label: Next
        accent_color: rgba(255,207,120,0.96)
      tap_action:
        action: call-service
        service: media_player.media_next_track
        target:
          entity_id: media_player.bed_room_tv
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:volume-minus
        label: Quieter
        accent_color: rgba(155,134,255,0.96)
      tap_action:
        action: call-service
        service: media_player.volume_down
        target:
          entity_id: media_player.bed_room_tv
    - type: custom:button-card
      template: mf_pill
      entity: media_player.bed_room_tv
      variables:
        icon: mdi:volume-mute
        label: '[[[ return entity?.attributes?.is_volume_muted ? "Unmute" : "Mute"; ]]]'
        accent_color: rgba(255,132,155,0.96)
      tap_action:
        action: call-service
        service: media_player.volume_mute
        target:
          entity_id: media_player.bed_room_tv
        data:
          is_volume_muted: '[[[ return !(entity?.attributes?.is_volume_muted ?? false); ]]]'
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:volume-plus
        label: Louder
        accent_color: rgba(107,226,255,0.96)
      tap_action:
        action: call-service
        service: media_player.volume_up
        target:
          entity_id: media_player.bed_room_tv
  - type: custom:button-card
    template: mf_section_label
    variables:
      icon: mdi:television
      label: Screens
      accent_color: rgba(136,199,216,0.95)
  - type: custom:button-card
    template: mf_device_row
    entity: media_player.bed_room_tv
    variables:
      icon: mdi:television-play
      title: Bedroom TV
      subtitle: '[[[ return (entity?.attributes?.source || entity?.attributes?.app_name || "YouTube") + " · " + Math.round((entity?.attributes?.volume_level ?? 0.18) * 100) + " volume"; ]]]'
      accent_color: rgba(241,194,122,0.96)
  - type: custom:button-card
    template: mf_device_row
    entity: media_player.lg_webos_tv_ua7700pub
    variables:
      icon: mdi:television
      title: Living Room TV
      subtitle: LG webOS · ready
      accent_color: rgba(136,199,216,0.95)
  - type: custom:button-card
    template: mf_device_row
    entity: media_player.32q3k_2
    variables:
      icon: mdi:television
      title: Kitchen TV
      subtitle: TCL · Android TV
      accent_color: rgba(155,134,255,0.96)
  - type: custom:button-card
    template: mf_device_row
    entity: media_player.luna_s_firetvstick
    variables:
      icon: mdi:cast
      title: Fire TV
      subtitle: Bedroom route
      accent_color: rgba(156,201,162,0.95)
  - type: custom:button-card
    template: mf_section_label
    variables:
      icon: mdi:music
      label: Audio
      accent_color: rgba(156,201,162,0.95)
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: mf_tile
      entity: media_player.den
      variables:
        icon: mdi:speaker-wireless
        title: Sonos Den
        value: '[[[ return entity?.state === "playing" ? "Playing" : entity?.state === "unavailable" ? "Add in HA" : "Ready"; ]]]'
        subtitle: Era 100
        accent_color: rgba(156,201,162,0.95)
    - type: custom:button-card
      template: mf_tile
      entity: media_player.roam_2
      variables:
        icon: mdi:speaker-bluetooth
        title: Sonos Roam
        value: '[[[ return entity?.state === "playing" ? "Playing" : entity?.state === "unavailable" ? "Offline" : "Ready"; ]]]'
        subtitle: Portable
        accent_color: rgba(155,134,255,0.96)
    - type: custom:button-card
      template: mf_tile
      entity: media_player.spotify_michael_sanchez
      variables:
        icon: mdi:music-circle-outline
        title: Spotify
        value: '[[[ return entity?.state === "playing" ? "Playing" : "Ready"; ]]]'
        subtitle: Mike's Spotify
        accent_color: rgba(156,201,162,0.95)
    - type: custom:button-card
      template: mf_tile
      entity: media_player.michael_s_2nd_echo_dot
      variables:
        icon: mdi:volume-high
        title: Echo Dot
        value: '[[[ return entity?.state === "playing" ? "Playing" : "Idle"; ]]]'
        subtitle: Local speaker
        accent_color: rgba(136,199,216,0.95)
  - type: custom:button-card
    template: mf_section_label
    variables:
      icon: mdi:home-sound-out-outline
      label: Whole-home actions
      accent_color: rgba(255,207,120,0.96)
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:pause-circle-outline
        label: Pause everywhere
        accent_color: rgba(255,207,120,0.96)
      tap_action:
        action: call-service
        service: media_player.media_pause
        target:
          entity_id:
          - media_player.bed_room_tv
          - media_player.lg_webos_tv_ua7700pub
          - media_player.32q3k_2
          - media_player.luna_s_firetvstick
          - media_player.den
          - media_player.roam_2
          - media_player.spotify_michael_sanchez
          - media_player.michael_s_2nd_echo_dot
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:power-standby
        label: Screens off
        accent_color: rgba(255,132,155,0.96)
      tap_action:
        action: call-service
        service: media_player.turn_off
        confirmation:
          text: Power off every screen?
        target:
          entity_id:
          - media_player.bed_room_tv
          - media_player.lg_webos_tv_ua7700pub
          - media_player.32q3k_2
          - media_player.luna_s_firetvstick
