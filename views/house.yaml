title: House
path: house
icon: mdi:robot-vacuum
type: sections
max_columns: 1
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: custom:button-card
    template: sky_system
  - type: custom:button-card
    template: mf_page_title
    variables:
      title: House
      subtitle: Sebastian, cabin climate, and home devices.
  - type: custom:button-card
    template: mf_hero
    entity: vacuum.roomba
    variables:
      icon: mdi:robot-vacuum
      value: '[[[ if (!entity || ["unavailable", "unknown"].includes(entity.state)) return "Not available"; return entity?.state === "unavailable" || !entity ? "Offline" : entity.state.replace("_", " "); ]]]'
      subtitle: A little help around the house
      accent_color: rgba(136,199,216,0.95)
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: mf_tile
      entity: vacuum.roomba
      variables:
        icon: mdi:robot-vacuum
        title: Roomba
        value: '[[[ if (!entity || ["unavailable", "unknown"].includes(entity.state)) return "Not available"; return entity?.state === "unavailable" || !entity ? "Offline" : entity.state.replace("_", " "); ]]]'
        subtitle: Power on dock to add
        accent_color: rgba(136,199,216,0.95)
    - type: custom:button-card
      template: mf_tile
      entity: climate.el_rocco_climate
      variables:
        icon: mdi:thermometer
        title: Cabin climate
        value: '[[[ if (!entity || ["unavailable", "unknown"].includes(entity.state)) return "Not available"; return entity && !["unavailable", "unknown"].includes(entity.state) && Number.isFinite(entity.attributes?.temperature) ? entity.attributes.temperature + "°" : "No reading"; ]]]'
        subtitle: El Rocco
    - type: custom:button-card
      template: mf_tile
      entity: light.living_room
      variables:
        icon: mdi:bridge
        title: Living room
        value: '[[[ if (!entity || ["unavailable", "unknown"].includes(entity.state)) return "Not available"; return !entity ? "Not connected" : entity.state === "unavailable" ? "Offline" : entity.state.replace(/_/g, " "); ]]]'
        subtitle: Hue room lights
        accent_color: rgba(241,194,122,0.96)
    - type: custom:button-card
      template: mf_tile
      tap_action:
        action: navigate
        navigation_path: /config/integrations
      variables:
        icon: mdi:robot-happy-outline
        title: Home Assistant
        value: Open settings
        subtitle: Manage your integrations
        accent_color: rgba(156,201,162,0.95)
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:home-import-outline
        label: Dock
        accent_color: rgba(156,201,162,0.95)
      tap_action:
        action: call-service
        service: vacuum.return_to_base
        target:
          entity_id: vacuum.roomba
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:star-four-points-outline
        label: Start cleaning
        accent_color: rgba(241,194,122,0.96)
      tap_action:
        action: call-service
        service: vacuum.start
        target:
          entity_id: vacuum.roomba
    - type: custom:button-card
      template: mf_pill
      variables:
        icon: mdi:pause
        label: Pause
        accent_color: rgba(217,154,169,0.95)
      tap_action:
        action: call-service
        service: vacuum.pause
        target:
          entity_id: vacuum.roomba
