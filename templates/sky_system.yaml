button_card_templates:
  sky_system:
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      canvas: |
        [[[
          const isDay = states['sun.sun']?.state === 'above_horizon';
          const condition = states['weather.forecast_home']?.state || 'clear-night';
          const isStorm = /lightning|pouring|hail/.test(condition);
          const phase = isDay ? 'is-day' : 'is-night';
          return `
            <div class="mf-ambient ${phase} ${isStorm ? 'is-storm' : ''}">
              <div class="mf-aurora mf-aurora-a"></div>
              <div class="mf-aurora mf-aurora-b"></div>
              <div class="mf-orb"></div>
              <div class="mf-stars mf-stars-a"></div>
              <div class="mf-stars mf-stars-b"></div>
              <div class="mf-horizon"></div>
              <div class="mf-grid"></div>
              <div class="mf-vignette"></div>
            </div>
          `;
        ]]]
    extra_styles: |
      [[[
        const isEditing = window.location.search.includes('edit=1') || window.location.pathname.includes('config');
        if (isEditing) {
          return `
            #card {
              min-height: 72px !important;
              border-radius: 18px !important;
              border: 1px dashed rgba(107, 226, 255, .42) !important;
              background: rgba(8, 14, 24, .82) !important;
            }
            #card::after {
              content: 'HearthOS ambient layer';
              position: absolute;
              inset: 0;
              display: grid;
              place-items: center;
              color: rgba(200, 241, 255, .78);
              font: 750 12px/1.2 ui-sans-serif, system-ui;
              letter-spacing: .1em;
              text-transform: uppercase;
            }
            .mf-ambient { display: none !important; }
          `;
        }
        return `
          #card {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            min-height: 100dvh !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            pointer-events: none !important;
            overflow: hidden !important;
            z-index: 0 !important;
          }
          .mf-ambient {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
              radial-gradient(circle at 78% 0%, rgba(95, 93, 255, .18), transparent 33rem),
              radial-gradient(circle at 3% 28%, rgba(33, 217, 206, .14), transparent 30rem),
              linear-gradient(180deg, #0b1020 0%, #080d18 48%, #05080f 100%);
            isolation: isolate;
          }
          .mf-ambient.is-day {
            background:
              radial-gradient(circle at 78% 0%, rgba(255, 191, 107, .22), transparent 31rem),
              radial-gradient(circle at 2% 30%, rgba(66, 219, 211, .15), transparent 30rem),
              linear-gradient(180deg, #18253a 0%, #101b2b 48%, #09111d 100%);
          }
          .mf-aurora {
            position: absolute;
            width: 92vmax;
            height: 44vmax;
            border-radius: 50%;
            filter: blur(72px) saturate(1.32);
            opacity: .42;
            mix-blend-mode: screen;
            will-change: transform;
          }
          .mf-aurora-a {
            top: -25vmax;
            left: -18vmax;
            background: conic-gradient(from 105deg, transparent 0 15%, rgba(85, 235, 220, .78) 28%, rgba(91, 118, 255, .62) 46%, transparent 62%);
            animation: mfAuroraA 18s ease-in-out infinite alternate;
          }
          .mf-aurora-b {
            top: 4vmax;
            right: -36vmax;
            background: conic-gradient(from 260deg, transparent 0 18%, rgba(160, 104, 255, .68) 31%, rgba(62, 220, 236, .46) 48%, transparent 64%);
            animation: mfAuroraB 23s ease-in-out infinite alternate;
          }
          .mf-orb {
            position: absolute;
            top: 56px;
            right: -26px;
            width: 116px;
            height: 116px;
            border-radius: 50%;
            background: radial-gradient(circle at 34% 32%, #fff7cf 0 11%, #ffd46f 27%, #e98972 55%, rgba(233, 137, 114, .12) 69%, transparent 71%);
            filter: drop-shadow(0 0 30px rgba(255, 207, 120, .32));
            opacity: .92;
          }
          .is-night .mf-orb {
            background: radial-gradient(circle at 34% 32%, #f7fbff 0 14%, #bbd9ef 34%, #7181b8 58%, rgba(113,129,184,.10) 69%, transparent 71%);
            filter: drop-shadow(0 0 32px rgba(151, 198, 255, .28));
          }
          .mf-stars {
            position: absolute;
            inset: 0;
            background-image:
              radial-gradient(circle at 8% 12%, rgba(226,247,255,.82) 0 1px, transparent 1.7px),
              radial-gradient(circle at 21% 31%, rgba(151,225,255,.66) 0 1px, transparent 1.8px),
              radial-gradient(circle at 38% 9%, rgba(255,226,170,.76) 0 1px, transparent 1.8px),
              radial-gradient(circle at 57% 24%, rgba(229,222,255,.70) 0 1px, transparent 1.8px),
              radial-gradient(circle at 74% 15%, rgba(150,231,255,.64) 0 1px, transparent 1.8px),
              radial-gradient(circle at 91% 35%, rgba(255,224,168,.72) 0 1px, transparent 1.8px),
              radial-gradient(circle at 14% 67%, rgba(229,222,255,.58) 0 1px, transparent 1.8px),
              radial-gradient(circle at 47% 57%, rgba(153,229,255,.62) 0 1px, transparent 1.8px),
              radial-gradient(circle at 83% 72%, rgba(255,227,176,.60) 0 1px, transparent 1.8px);
            animation: mfTwinkle 6s ease-in-out infinite;
          }
          .mf-stars-b {
            transform: scale(1.15) translate3d(3%, 2%, 0);
            opacity: .38;
            animation-duration: 9s;
            animation-direction: reverse;
          }
          .is-day .mf-stars { opacity: .24; }
          .mf-horizon {
            position: absolute;
            left: -12%;
            right: -12%;
            bottom: -18vh;
            height: 48vh;
            border-radius: 50% 50% 0 0;
            background:
              radial-gradient(ellipse at 50% 0%, rgba(74, 238, 219, .11), transparent 44%),
              linear-gradient(180deg, rgba(9, 20, 27, .54), rgba(3, 6, 11, .94));
            box-shadow: 0 -20px 70px rgba(69, 222, 214, .08);
          }
          .mf-grid {
            position: absolute;
            left: -22%;
            right: -22%;
            bottom: -9vh;
            height: 34vh;
            opacity: .13;
            background-image:
              linear-gradient(rgba(110, 229, 255, .42) 1px, transparent 1px),
              linear-gradient(90deg, rgba(110, 229, 255, .42) 1px, transparent 1px);
            background-size: 36px 28px;
            transform: perspective(360px) rotateX(63deg);
            transform-origin: 50% 100%;
            mask-image: linear-gradient(to bottom, transparent, black 38%);
          }
          .mf-vignette {
            position: absolute;
            inset: 0;
            background:
              linear-gradient(180deg, rgba(2, 5, 12, .02), rgba(2, 5, 12, .30)),
              radial-gradient(ellipse at center, transparent 35%, rgba(2, 4, 10, .38) 100%);
          }
          .is-storm::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(205, 236, 255, .26);
            mix-blend-mode: screen;
            animation: mfFlash 7s steps(1) infinite;
          }
          @keyframes mfAuroraA {
            from { transform: translate3d(-5%, -2%, 0) rotate(-5deg) scale(.94); }
            to { transform: translate3d(16%, 12%, 0) rotate(9deg) scale(1.08); }
          }
          @keyframes mfAuroraB {
            from { transform: translate3d(5%, -3%, 0) rotate(4deg) scale(1.02); }
            to { transform: translate3d(-18%, 10%, 0) rotate(-8deg) scale(.92); }
          }
          @keyframes mfTwinkle {
            0%, 100% { opacity: .48; filter: brightness(.9); }
            50% { opacity: .86; filter: brightness(1.25); }
          }
          @keyframes mfFlash {
            0%, 91%, 94%, 100% { opacity: 0; }
            92% { opacity: .64; }
            93% { opacity: .18; }
          }
          @media (prefers-reduced-motion: reduce) {
            .mf-aurora, .mf-stars, .is-storm::after { animation: none !important; }
          }
        `;
      ]]]
    styles:
      card:
        - height: 0
        - min-height: 0
        - padding: 0
        - margin: 0
        - border: none
        - background: transparent
        - box-shadow: none
        - overflow: visible
      grid:
        - grid-template-areas: '"canvas"'
      custom_fields:
        canvas:
          - grid-area: canvas
          - position: fixed
          - inset: 0
          - width: 100vw
          - height: 100vh
          - pointer-events: none
