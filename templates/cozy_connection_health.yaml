button_card_templates:
  mf_connection_health:
    template: mf_tile
    triggers_update:
    - light.living_room
    - light.bedroom
    - light.big_lamp
    - light.light_panels_51_66_88
    - media_player.bed_room_tv
    - media_player.media_room
    - media_player.kitchen
    - media_player.den
    - media_player.roam_2
    - media_player.32q3k_2
    - media_player.spotify_michael_sanchez
    - alarm_control_panel.blink_home
    - camera.front_door
    - sensor.nas_blink_front_door_temperature
    - sensor.el_rocco_battery_level
    - weather.forecast_home
    show_label: true
    variables:
      title: Home connections
      icon: mdi:lan-connect
      value: '[[[ const ids = [''light.living_room'', ''light.bedroom'', ''light.big_lamp'', ''light.light_panels_51_66_88'', ''media_player.bed_room_tv'', ''media_player.media_room'',
        ''media_player.kitchen'', ''media_player.den'', ''media_player.roam_2'', ''media_player.32q3k_2'', ''media_player.spotify_michael_sanchez'', ''alarm_control_panel.blink_home'',
        ''camera.front_door'', ''sensor.nas_blink_front_door_temperature'', ''sensor.el_rocco_battery_level'', ''weather.forecast_home'']; const good = ids.filter(id
        => states[id] && !["unknown", "unavailable"].includes(states[id].state)).length; return good + " / " + ids.length; ]]]'
      subtitle: Devices reporting a known state
    tap_action:
      action: navigate
      navigation_path: /mobile-forge/house
