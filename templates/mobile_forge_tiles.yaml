button_card_templates:
  mf_page_title:
    show_icon: false
    show_name: true
    show_label: true
    custom_fields:
      eyebrow: '[[[ return variables.eyebrow || "HEARTHOS · LIVE"; ]]]'
    name: '[[[ return variables.title || ""; ]]]'
    label: '[[[ return variables.subtitle || ""; ]]]'
    styles:
      card:
        - padding: 24px 6px 12px
        - background: transparent
        - box-shadow: none
        - border: none
        - position: relative
        - z-index: 2
      grid:
        - 'grid-template-areas: "eyebrow" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content min-content
      name:
        - justify-self: start
        - color: rgba(244,249,255,0.98)
        - font-size: 36px
        - line-height: 40px
        - font-weight: 820
        - letter-spacing: -0.035em
      label:
        - justify-self: start
        - color: rgba(196,213,231,0.68)
        - font-size: 14px
        - line-height: 19px
        - font-weight: 650
        - padding-top: 6px
      custom_fields:
        eyebrow:
          - justify-self: start
          - color: rgba(107,226,255,0.88)
          - font-size: 10px
          - line-height: 14px
          - font-weight: 850
          - letter-spacing: 0.16em
          - padding-bottom: 7px

  mf_status_ribbon:
    show_icon: false
    show_name: false
    show_label: false
    tap_action:
      action: none
    custom_fields:
      status: |
        [[[
          const alarm = states['alarm_control_panel.blink_michael_trinidad'];
          const car = states['lock.el_rocco_lock'];
          const ha = states['update.home_assistant_core_update'];
          const alarmText = alarm?.state === 'armed_away' ? 'Armed away' : alarm?.state === 'armed_home' ? 'Armed home' : 'House clear';
          const carText = car?.state === 'locked' ? 'Car locked' : 'Check car';
          const updateText = ha?.state === 'on' ? 'Update ready' : 'Core current';
          return `
            <div class="mf-ribbon-copy">
              <span class="mf-live-dot"></span>
              <strong>${alarmText}</strong>
              <span>·</span><span>${carText}</span>
              <span>·</span><span>${updateText}</span>
            </div>
            <div class="mf-ribbon-mark">MF</div>
          `;
        ]]]
    extra_styles: |
      .mf-ribbon-copy { display:flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .mf-ribbon-copy span, .mf-ribbon-copy strong { overflow:hidden; text-overflow:ellipsis; }
      .mf-live-dot { flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:#6be2ff; box-shadow:0 0 0 4px rgba(107,226,255,.10),0 0 18px rgba(107,226,255,.75); animation:mfLive 2.4s ease-in-out infinite; }
      .mf-ribbon-mark { width:30px; height:30px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto; color:#07111c; background:linear-gradient(135deg,#6be2ff,#9b86ff); font-size:10px; font-weight:950; box-shadow:0 8px 22px rgba(81,181,255,.24); }
      @keyframes mfLive { 50% { opacity:.58; transform:scale(.86); } }
      @media (prefers-reduced-motion: reduce) { .mf-live-dot { animation:none; } }
    styles:
      card:
        - min-height: 48px
        - padding: 8px 10px 8px 14px
        - border-radius: 17px
        - border: 1px solid rgba(125,211,255,0.16)
        - background: linear-gradient(110deg, rgba(13,24,38,0.80), rgba(12,17,30,0.64))
        - box-shadow: inset 0 1px 0 rgba(255,255,255,0.055), 0 14px 34px rgba(1,4,12,0.30)
        - backdrop-filter: blur(22px) saturate(1.18)
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"status"'
      custom_fields:
        status:
          - display: flex
          - align-items: center
          - justify-content: space-between
          - gap: 10px
          - color: rgba(210,225,240,0.72)
          - font-size: 11px
          - line-height: 14px
          - font-weight: 650

  mf_hero:
    show_icon: true
    show_name: false
    show_label: true
    icon: '[[[ return variables.icon || "mdi:home"; ]]]'
    label: '[[[ return variables.subtitle || ""; ]]]'
    custom_fields:
      value: '[[[ return variables.value || (entity ? entity.state : ""); ]]]'
    styles:
      card:
        - min-height: 158px
        - padding: 18px
        - border-radius: 24px
        - border: 1px solid rgba(140,216,255,0.22)
        - background: radial-gradient(circle at 13% 18%, rgba(107,226,255,0.17), transparent 9rem), radial-gradient(circle at 88% 74%, rgba(157,119,255,0.16), transparent 12rem), linear-gradient(150deg, rgba(18,29,47,0.82), rgba(8,13,24,0.74))
        - box-shadow: 0 24px 64px rgba(1,4,12,0.46), inset 0 1px 0 rgba(255,255,255,0.08)
        - backdrop-filter: blur(24px) saturate(1.20)
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"i value" "i l"'
        - grid-template-columns: 92px 1fr
        - grid-template-rows: min-content min-content
        - column-gap: 18px
        - align-items: center
      icon:
        - width: 42px
        - color: '[[[ return variables.accent_color || "rgba(241,194,122,0.96)"; ]]]'
      img_cell:
        - grid-area: i
        - width: 74px
        - height: 74px
        - border-radius: 24px
        - background: radial-gradient(circle at 34% 24%, rgba(255,255,255,0.20), transparent 50%), rgba(107,226,255,0.09)
        - box-shadow: inset 0 0 0 1px rgba(126,220,255,0.20), 0 18px 38px rgba(0,0,0,0.28), 0 0 28px rgba(107,226,255,0.08)
      label:
        - grid-area: l
        - justify-self: start
        - color: rgba(196,213,231,0.68)
        - font-size: 13px
        - line-height: 18px
        - font-weight: 650
      custom_fields:
        value:
          - grid-area: value
          - justify-self: start
          - color: rgba(244,249,255,0.98)
          - font-size: 48px
          - line-height: 50px
          - font-weight: 350

  mf_tile:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    icon: '[[[ return variables.icon || "mdi:circle"; ]]]'
    name: '[[[ return variables.title || entity?.attributes?.friendly_name || ""; ]]]'
    label: '[[[ return variables.subtitle || ""; ]]]'
    custom_fields:
      value: '[[[ return variables.value || (entity ? entity.state : ""); ]]]'
    extra_styles: |
      #card::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(125deg, rgba(255,255,255,.075), transparent 34% 70%, rgba(107,226,255,.035));
        opacity: .82;
      }
    styles:
      card:
        - min-height: 110px
        - padding: 15px
        - border-radius: 21px
        - border: 1px solid rgba(137,210,255,0.16)
        - background: '[[[ const active = entity && ["on","playing","locked","armed_home","armed_away","charging","cleaning"].includes(entity.state); return active ? "radial-gradient(circle at 14% 8%, rgba(107,226,255,.14), transparent 8rem), radial-gradient(circle at 90% 88%, rgba(157,119,255,.10), transparent 9rem), linear-gradient(150deg, rgba(18,30,47,.84), rgba(8,14,25,.78))" : "linear-gradient(145deg, rgba(255,255,255,.045), transparent 38%), linear-gradient(150deg, rgba(15,23,36,.78), rgba(7,12,22,.74))"; ]]]'
        - box-shadow: '[[[ const active = entity && ["on","playing","locked","armed_home","armed_away","charging","cleaning"].includes(entity.state); return active ? "0 22px 54px rgba(1,5,14,.44), inset 0 1px 0 rgba(255,255,255,.08), 0 0 32px rgba(88,203,255,.06)" : "0 18px 46px rgba(1,5,14,.36), inset 0 1px 0 rgba(255,255,255,.05)"; ]]]'
        - backdrop-filter: blur(22px) saturate(1.18)
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"i n" "value value" "l l"'
        - grid-template-columns: 22px 1fr
        - grid-template-rows: min-content 1fr min-content
        - column-gap: 8px
        - row-gap: 5px
        - align-items: start
      icon:
        - width: 18px
        - color: '[[[ return variables.accent_color || "rgba(107,226,255,0.96)"; ]]]'
      img_cell:
        - justify-self: start
        - align-self: center
      name:
        - justify-self: start
        - align-self: center
        - color: rgba(240,247,255,0.94)
        - font-size: 14px
        - line-height: 18px
        - font-weight: 800
        - white-space: normal
        - text-align: left
      label:
        - justify-self: start
        - color: rgba(183,204,224,0.64)
        - font-size: 13px
        - line-height: 17px
        - font-weight: 650
      custom_fields:
        value:
          - grid-area: value
          - justify-self: start
          - align-self: end
          - color: rgba(244,249,255,0.98)
          - font-size: 30px
          - line-height: 32px
          - font-weight: 360

  # Light-only variant of mf_tile: tap = instant toggle,
  # hold / double-tap = native more-info dialog (full Hue
  # brightness + color + scene control). Do NOT use the bare
  # mf_tile toggle behaviour on sensors/cameras/locks.
  mf_light_tile:
    template: mf_tile
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info

  # Govee variant: tap still toggles, but the native more-info dialog is
  # disabled because Govee's color_temp_kelvin range is inverted (integration
  # bug) — dragging the slider throws "API-Error 400 colorTem". Adjust Govee
  # brightness/color via scenes (hs_color) or the Govee app instead.
  mf_govee_tile:
    template: mf_light_tile
    hold_action:
      action: none
    double_tap_action:
      action: none

  mf_pill:
    show_icon: true
    show_name: true
    icon: '[[[ return variables.icon || "mdi:circle"; ]]]'
    name: '[[[ return variables.label || ""; ]]]'
    styles:
      card:
        - min-height: 44px
        - padding: 0 14px
        - border-radius: 16px
        - border: 1px solid rgba(137,210,255,0.14)
        - background: linear-gradient(145deg, rgba(20,29,44,0.80), rgba(7,13,23,0.72))
        - box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 28px rgba(1,5,14,0.25)
        - backdrop-filter: blur(18px) saturate(1.16)
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 18px 1fr
        - column-gap: 8px
        - align-items: center
      icon:
        - width: 16px
        - color: '[[[ return variables.accent_color || "rgba(241,194,122,0.96)"; ]]]'
      name:
        - justify-self: start
        - color: rgba(235,244,255,0.90)
        - font-size: 13px
        - line-height: 15px
        - font-weight: 800

  mf_section_label:
    show_icon: true
    show_name: true
    icon: '[[[ return variables.icon || "mdi:label-outline"; ]]]'
    name: '[[[ return variables.label || ""; ]]]'
    styles:
      card:
        - min-height: 44px
        - padding: 0 14px
        - border-radius: 14px
        - border: 1px solid rgba(137,210,255,0.12)
        - background: linear-gradient(90deg, rgba(11,20,33,0.82), rgba(8,13,23,0.56))
        - box-shadow: inset 3px 0 0 rgba(107,226,255,0.50)
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 22px 1fr
        - column-gap: 8px
        - align-items: center
      icon:
        - width: 18px
        - color: '[[[ return variables.accent_color || "rgba(136,199,216,0.95)"; ]]]'
      name:
        - justify-self: start
        - color: rgba(235,244,255,0.90)
        - font-size: 16px
        - line-height: 18px
        - font-weight: 850

  mf_model_y_juniper:
    show_icon: false
    show_name: false
    show_label: false
    custom_fields:
      image: |
        [[[
          const src = variables.image || "/local/mobile-forge/model-y-juniper-transparent.png";
          return `
            <img src="${src}" alt="Tesla Model Y Juniper" style="
              width:100%;
              height:244px;
              display:block;
              object-fit:contain;
              object-position:center;
              filter:saturate(0.94) contrast(1.02);
            ">
            <div style="
              position:absolute;
              left:12px;
              bottom:12px;
              min-height:36px;
              padding:0 12px;
              display:inline-flex;
              align-items:center;
              gap:8px;
              border-radius:15px;
              border:1px solid rgba(131,218,255,0.19);
              background:rgba(7,13,24,0.80);
              color:rgba(240,247,255,0.95);
              font-weight:900;
              font-size:13px;
              line-height:1;
              backdrop-filter:blur(12px);
              box-shadow:0 12px 28px rgba(0,0,0,0.28);
              pointer-events:none;
            ">
              <ha-icon icon="mdi:car-electric" style="width:17px;height:17px;color:rgba(107,226,255,0.96);"></ha-icon>
              <span>Model Y Juniper</span>
            </div>
          `;
        ]]]
    styles:
      card:
        - height: 244px
        - padding: 0
        - border-radius: 24px
        - border: 1px solid rgba(137,210,255,0.18)
        - background: radial-gradient(circle at 70% 18%, rgba(107,226,255,.14), transparent 12rem), radial-gradient(circle at 22% 82%, rgba(157,119,255,.12), transparent 11rem), linear-gradient(150deg, rgba(16,27,44,.82), rgba(7,12,22,.76))
        - box-shadow: 0 24px 62px rgba(1,4,12,0.44), inset 0 1px 0 rgba(255,255,255,.06)
        - backdrop-filter: blur(24px) saturate(1.18)
        - overflow: hidden
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"image"'
      custom_fields:
        image:
          - grid-area: image

  mf_media_now:
    show_icon: false
    show_name: false
    show_label: false
    entity: media_player.bed_room_tv
    tap_action:
      action: more-info
    custom_fields:
      screen: |
        [[[
          const e = entity || states[variables.entity] || {};
          const attrs = e.attributes || {};
          const state = e.state || "idle";
          const source = attrs.source || attrs.app_name || "YouTube";
          const title = attrs.media_title || attrs.friendly_name || variables.title || "Bedroom TV";
          const room = variables.room || "Bedroom TV";
          const pct = Math.max(0, Math.min(100, Number(attrs.media_position || 0) / Math.max(1, Number(attrs.media_duration || 1)) * 100));
          const width = Number.isFinite(pct) && pct > 0 ? pct : 42;
          const label = state === "playing" ? "Playing in bedroom" : state === "paused" ? "Paused" : "Ready";
          return `
            <div style="min-height:196px;padding:14px;position:relative;display:grid;align-items:stretch;background:radial-gradient(circle at 72% 12%,rgba(107,226,255,.18),transparent 9rem),linear-gradient(180deg,rgba(14,24,40,.76),rgba(7,11,21,.70));">
              <div style="position:absolute;inset:20px 34px 64px;border-radius:32px;background:radial-gradient(circle,rgba(121,199,255,.22),transparent 68%);filter:blur(28px);"></div>
              <div style="position:relative;min-height:168px;padding:16px;border-radius:19px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(121,199,255,.16),transparent 42%),radial-gradient(circle at 82% 18%,rgba(255,211,164,.12),transparent 28%),#10151d;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 22px 42px rgba(0,0,0,.32);display:grid;align-content:end;gap:8px;">
                <div style="position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;color:rgba(255,246,235,.56);font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;">
                  <span>${room}</span><span>${source}</span>
                </div>
                <div style="font-size:28px;line-height:30px;font-weight:850;color:rgba(255,246,235,.96);">${title}</div>
                <div style="color:rgba(255,235,215,.62);font-size:13px;line-height:17px;font-weight:650;">${label}</div>
                <div style="height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);">
                <div style="height:100%;width:${width}%;border-radius:999px;background:linear-gradient(90deg,#6be2ff,#9b86ff,#ffcf78);box-shadow:0 0 14px rgba(107,226,255,.34);"></div>
                </div>
              </div>
            </div>
          `;
        ]]]
      meta: |
        [[[
          const e = entity || states[variables.entity] || {};
          const attrs = e.attributes || {};
          const source = attrs.source || attrs.app_name || "YouTube";
          const volume = attrs.volume_level !== undefined ? Math.round(Number(attrs.volume_level) * 100) : 18;
          const state = e.state === "playing" ? "Now playing" : e.state === "paused" ? "Paused" : "Ready";
          const title = attrs.friendly_name || variables.title || "Bedroom TV";
          const detail = `${source} · ${volume} volume`;
          return `
            <div style="padding:12px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;">
              <div style="min-width:0;">
                <div style="color:#6be2ff;font-size:11px;line-height:14px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;">${state}</div>
                <div style="margin-top:3px;font-size:23px;line-height:27px;font-weight:850;color:rgba(255,246,235,.96);">${title}</div>
                <div style="color:rgba(255,235,215,.62);font-size:13px;line-height:18px;">${detail}</div>
              </div>
              <div style="display:flex;gap:8px;">
                <span style="width:38px;height:38px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);"><ha-icon icon="mdi:power" style="width:18px;height:18px;color:#f3a6b8;"></ha-icon></span>
                <span style="width:38px;height:38px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);"><ha-icon icon="mdi:pause" style="width:18px;height:18px;color:#ffd3a4;"></ha-icon></span>
                <span style="width:38px;height:38px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);"><ha-icon icon="mdi:volume-high" style="width:18px;height:18px;color:#79c7ff;"></ha-icon></span>
              </div>
            </div>
          `;
        ]]]
    styles:
      card:
        - padding: 0
        - border-radius: 24px
        - border: 1px solid rgba(137,210,255,0.18)
        - background: linear-gradient(150deg, rgba(16,27,44,0.82), rgba(7,12,22,0.76))
        - box-shadow: 0 24px 62px rgba(1,4,12,0.44), inset 0 1px 0 rgba(255,255,255,.06)
        - backdrop-filter: blur(24px) saturate(1.18)
        - overflow: hidden
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"screen" "meta"'
      custom_fields:
        screen:
          - grid-area: screen
        meta:
          - grid-area: meta

  mf_device_row:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    icon: '[[[ return variables.icon || "mdi:television"; ]]]'
    name: '[[[ return variables.title || entity?.attributes?.friendly_name || ""; ]]]'
    label: '[[[ return variables.subtitle || ""; ]]]'
    custom_fields:
      state: |
        [[[
          if (variables.value) return variables.value;
          if (!entity || entity.state === "unavailable") return "Offline";
          if (entity.state === "playing") return "Playing";
          if (entity.state === "paused") return "Paused";
          if (entity.state === "standby") return "Standby";
          if (entity.state === "off") return "Standby";
          return entity.state.replace(/_/g, " ");
        ]]]
    styles:
      card:
        - min-height: 72px
        - padding: 12px
        - border-radius: 18px
        - border: 1px solid rgba(137,210,255,0.16)
        - background: '[[[ return entity?.state === "playing" ? "radial-gradient(circle at 10% 20%, rgba(107,226,255,.15), transparent 8rem), linear-gradient(150deg, rgba(18,31,49,.84), rgba(8,13,24,.76))" : "linear-gradient(150deg, rgba(15,23,36,.78), rgba(7,12,22,.74))"; ]]]'
        - box-shadow: 0 18px 46px rgba(1,5,14,0.36), inset 0 1px 0 rgba(255,255,255,.05)
        - backdrop-filter: blur(22px) saturate(1.18)
        - position: relative
        - z-index: 2
      grid:
        - grid-template-areas: '"i n state" "i l state"'
        - grid-template-columns: 42px 1fr auto
        - grid-template-rows: min-content min-content
        - column-gap: 12px
        - align-items: center
      img_cell:
        - grid-area: i
        - width: 42px
        - height: 42px
        - border-radius: 15px
        - background: rgba(255,255,255,0.07)
      icon:
        - width: 18px
        - color: '[[[ return variables.accent_color || "rgba(136,199,216,0.95)"; ]]]'
      name:
        - grid-area: n
        - justify-self: start
        - color: rgba(240,247,255,0.94)
        - font-size: 14px
        - line-height: 18px
        - font-weight: 850
        - white-space: normal
        - text-align: left
      label:
        - grid-area: l
        - justify-self: start
        - color: rgba(183,204,224,0.64)
        - font-size: 12px
        - line-height: 16px
        - font-weight: 650
      custom_fields:
        state:
          - grid-area: state
          - color: rgba(210,229,244,0.84)
          - font-size: 12px
          - line-height: 16px
          - font-weight: 850

  mf_nav_spacer:
    show_icon: false
    show_name: false
    show_label: false
    tap_action:
      action: none
    styles:
      card:
        - height: 104px
        - min-height: 104px
        - padding: 0
        - background: transparent
        - box-shadow: none
        - border: none
        - pointer-events: none
        - position: relative
        - z-index: 1
